name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Release package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: ':excimer'
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: composer ci

  coverage:
    name: Coverage upload (Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: excimer
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: composer test:coverage
      - uses: codecov/codecov-action@v7
        with:
          files: build/coverage/clover.xml
          use_oidc: true
          fail_ci_if_error: true

  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: excimer
          coverage: pcov
          tools: composer:v2, infection:0.35.8
      - uses: ramsey/composer-install@v4
      - run: composer infection

  matrix:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: ':excimer'
          tools: composer:v2
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: composer test

  excimer:
    name: Excimer spool integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: excimer
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: php --ri excimer
      - run: composer test:integration

  swoole:
    name: Swoole coroutine worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --working-dir=examples/swoole --no-interaction --prefer-dist
      - run: bash examples/swoole/smoke.sh

  roadrunner:
    name: RoadRunner worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: excimer, sockets
          tools: composer:v2
      - name: Install RoadRunner 2025.1.15
        working-directory: ${{ runner.temp }}
        run: |
          archive=roadrunner-2025.1.15-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/roadrunner-server/roadrunner/releases/download/v2025.1.15/$archive" \
            --output "$archive"
          echo "74589ff95e022dddf163f9316821cb80423a7db9865e96ce30a436d6898e34e7  $archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=1 roadrunner-2025.1.15-linux-amd64/rr
      - run: composer install --working-dir=examples/roadrunner --no-interaction --prefer-dist
      - run: bash examples/roadrunner/smoke.sh
        env:
          ROADRUNNER_BINARY: ${{ runner.temp }}/rr

  frankenphp:
    name: FrankenPHP worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --working-dir=examples/frankenphp --no-interaction --prefer-dist
      - run: bash examples/frankenphp/smoke.sh
