name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: ':excimer'
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: composer ci

  coverage:
    name: Coverage upload (Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: excimer
          coverage: pcov
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: composer test:coverage
      - uses: codecov/codecov-action@v7
        with:
          files: build/coverage/clover.xml
          use_oidc: true
          fail_ci_if_error: true

  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: excimer
          coverage: pcov
          tools: composer:v2, infection:0.35.8
      - uses: ramsey/composer-install@v4
      - run: composer infection

  matrix:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: ':excimer'
          tools: composer:v2
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: composer test

  excimer:
    name: Excimer spool integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: excimer
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: php --ri excimer
      - run: composer test:integration
